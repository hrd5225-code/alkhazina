name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web files (fonts, libraries, icons)
        run: |
          mkdir -p www/fonts www/lib assets tmpdeps
          if [ -f index.html ] && [ ! -f www/index.html ]; then mv index.html www/index.html; fi
          test -f www/index.html
          cd tmpdeps
          npm init -y > /dev/null
          npm i @fontsource/ibm-plex-sans-arabic @fontsource/el-messiri html2canvas@1.4.1 jspdf@2.5.1 --no-audit --no-fund
          cd ..
          cp tmpdeps/node_modules/html2canvas/dist/html2canvas.min.js www/lib/
          cp tmpdeps/node_modules/jspdf/dist/jspdf.umd.min.js www/lib/
          python3 - <<'PY'
          import re, shutil
          NM = 'tmpdeps/node_modules/@fontsource'
          out = []
          def take(pkg, weights):
              for w in weights:
                  css = open(f'{NM}/{pkg}/{w}.css', encoding='utf-8').read()
                  for blk in re.findall(r'/\*.*?\*/\s*@font-face\s*\{.*?\}', css, flags=re.S):
                      name = re.search(r'/\*\s*(\S+)\s*\*/', blk).group(1)
                      if not re.search(r'-(arabic|latin)-\d+-normal$', name):
                          continue
                      f = name + '.woff2'
                      blk = re.sub(r'src:[^;]+;', 'src: url(fonts/' + f + ') format("woff2");', blk)
                      out.append(re.sub(r'/\*.*?\*/\s*', '', blk, count=1))
                      shutil.copy(f'{NM}/{pkg}/files/{f}', 'www/fonts/' + f)
          take('ibm-plex-sans-arabic', [400, 500, 600])
          take('el-messiri', [500, 700])
          open('www/fonts.css', 'w', encoding='utf-8').write('\n'.join(out))
          PY
          cat > mkicons.js <<'JS'
          const sharp = require('sharp');
          const art = '<g fill="none" stroke="#D5AE5A"><rect x="132" y="132" width="760" height="760" rx="150" stroke-width="34"/><circle cx="512" cy="512" r="190" stroke-width="34"/><path d="M512 277V212M512 747V812M277 512H212M747 512H812" stroke-width="30"/></g><circle cx="512" cy="512" r="46" fill="#D5AE5A"/>';
          const wrap = (inner) => Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">' + inner + '</svg>');
          const bg = '<rect width="1024" height="1024" fill="#0F2236"/>';
          (async () => {
            await sharp(wrap(bg + art)).png().toFile('assets/icon-only.png');
            await sharp(wrap('<g transform="translate(512 512) scale(0.62) translate(-512 -512)">' + art + '</g>')).png().toFile('assets/icon-foreground.png');
            await sharp(wrap(bg)).png().toFile('assets/icon-background.png');
          })();
          JS
          node mkicons.js
          ls -R www | head -40

      - name: Add Android platform
        run: npx cap add android

      - name: Fixed signing key and version number (so new builds install over old ones)
        run: |
          mkdir -p ~/.android
          if [ ! -f signing/debug.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/debug.keystore -storetype JKS -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add signing/debug.keystore
            git commit -m "Add fixed signing key"
            git push origin HEAD:refs/heads/${{ github.ref_name }}
          fi
          cp signing/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Generate app icons
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0F2236' --iconBackgroundColorDark '#0F2236'

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alkhazina-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
